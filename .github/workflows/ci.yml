name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Build (-Werror)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCHED_WERROR=ON
          cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Build with ASan + UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DSCHED_SANITIZE=ON
          cmake --build build-asan -j 4
      - name: Test with ASan + UBSan
        run: ctest --test-dir build-asan --output-on-failure -j 4

  coverage:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest gcovr
      - name: Coverage (fails below 90% line coverage of src/)
        run: make coverage
      - uses: codecov/codecov-action@v7
        with:
          files: build-cov/coverage.xml
          disable_search: true # upload only gcovr's src/ report
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install clang-format==23.1.1
      - run: make format-check

  fuzz:
    # Coverage-guided fuzzing of the input parsers and engine (libFuzzer with
    # ASan + UBSan): 5 minutes on pushes, 1 minute on pull requests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build fuzzer
        run: |
          clang -std=c11 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
                -ffp-contract=off -Iinclude -Isrc tests/fuzz/fuzz_input.c \
                $(ls src/*/*.c | grep -v src/cli/main.c) -o fuzz_input
      - name: Fuzz
        run: |
          secs=60
          if [ "${{ github.event_name }}" = "push" ]; then secs=300; fi
          mkdir -p corpus && cp tests/fuzz/corpus/* corpus/
          ./fuzz_input corpus -max_total_time=$secs -timeout=10 -rss_limit_mb=2048 \
                       -print_final_stats=1 2>&1 | tail -25
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: crash-*
