name: Pages

# Builds the WebAssembly visualiser, checks it against the native binary, and
# deploys it to GitHub Pages from main. Pull requests only build and test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build WebAssembly and compare with the native binary
        run: make wasm-test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-wasm/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
